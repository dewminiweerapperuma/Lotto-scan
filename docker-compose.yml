version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: lottoscan-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=lotto-scan
    networks:
      - lotto-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lottoscan-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/lotto-scan
      - JWT_SECRET=your_secret_key_here_must_be_long_and_secure
      - NODE_ENV=development
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - mongodb
    networks:
      - lotto-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lottoscan-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - lotto-network

networks:
  lotto-network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
