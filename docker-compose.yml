version: '3.8'

services:
  questdb:
    image: questdb/questdb:latest
    container_name: lottoscan-questdb
    ports:
      - "8812:8812"
      - "9000:9000"
      - "9009:9009"
    volumes:
      - questdb_data:/var/lib/questdb
    environment:
      - QDB_TELEMETRY_ENABLED=false
    networks:
      - lotto-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lottoscan-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - QUESTDB_HOST=questdb
      - QUESTDB_PG_PORT=8812
      - QUESTDB_USER=admin
      - QUESTDB_PASSWORD=quest
      - QUESTDB_DATABASE=qdb
      - JWT_SECRET=your_secret_key_here_must_be_long_and_secure
      - NODE_ENV=development
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - questdb
    networks:
      - lotto-network

  frontend:
    build:
      context: ./lottoscan-web-frontend
      dockerfile: Dockerfile
    container_name: lottoscan-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    volumes:
      - ./lottoscan-web-frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - lotto-network

networks:
  lotto-network:
    driver: bridge

volumes:
  questdb_data:
    driver: local
